name: Kids Seekho Debug Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate required files
        run: |
          set -e
          for f in index.html style.css app.js manifest.webmanifest sw.js; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done
          echo "Required files OK"

      - name: Validate HTML references
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          for (const file of ['style.css', 'app.js', 'manifest.webmanifest']) {
            if (!html.includes(file)) throw new Error(`Missing HTML reference: ${file}`);
          }
          console.log('HTML references OK');
          NODE

      - name: JavaScript syntax check
        run: node --check app.js

      - name: Service worker syntax check
        run: node --check sw.js

      - name: Manifest JSON check
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          for (const key of ['name', 'short_name', 'start_url', 'display']) {
            if (!manifest[key]) throw new Error(`Manifest missing ${key}`);
          }
          console.log('Manifest JSON OK');
          NODE

      - name: App content smoke test
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('app.js', 'utf8');
          const required = [
            'homeScreen', 'learnScreen', 'traceCanvas', 'success',
            'English', 'Numbers', 'Hindi', 'Shapes',
            'speechSynthesis', 'localStorage'
          ];
          for (const item of required) {
            if (!html.includes(item) && !js.includes(item)) {
              throw new Error(`Missing app feature/reference: ${item}`);
            }
          }
          console.log('Content smoke test OK');
          NODE

      - name: Install Playwright
        run: npm init -y >/dev/null 2>&1 && npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: |
          python3 -m http.server 4173 >/tmp/kids-seekho-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const errors = [];
            page.on('pageerror', err => errors.push(err.message));
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            if (!(await page.title()).toLowerCase().includes('kids seekho')) {
              throw new Error('Unexpected page title');
            }
            await page.getByText('English', { exact: true }).click();
            await page.waitForTimeout(300);
            const letter = await page.locator('#letter').textContent();
            if (!letter || !letter.trim()) throw new Error('English lesson did not open');
            const canvas = page.locator('#traceCanvas');
            if (!(await canvas.isVisible())) throw new Error('Trace canvas is not visible');
            const box = await canvas.boundingBox();
            if (!box) throw new Error('Could not measure trace canvas');
            await page.mouse.move(box.x + box.width * 0.30, box.y + box.height * 0.30);
            await page.mouse.down();
            await page.mouse.move(box.x + box.width * 0.70, box.y + box.height * 0.70, { steps: 8 });
            await page.mouse.up();
            const check = page.getByText(/Check|जाँच/i).first();
            if (await check.count()) await check.click();
            if (errors.length) throw new Error(`Browser page errors: ${errors.join(' | ')}`);
            console.log(`Browser smoke test OK: first English item = ${letter.trim()}`);
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Upload debug bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-seekho-debug-build
          path: |
            index.html
            style.css
            app.js
            manifest.webmanifest
            sw.js
            README.md
