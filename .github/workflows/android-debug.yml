name: Kids Seekho Android Debug

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate tap-to-learn app
        run: |
          node --check app.js
          test -s index.html
          test -s style.css
          grep -Fq "दिव्यांश" index.html
          grep -Fq "A for Apple" app.js
          grep -Fq "अ से अनार" app.js
          grep -Fq "lessonCard" index.html
          if grep -Eq 'traceCanvas|autoCheck|AI मॉडल डाउनलोड' index.html app.js; then
            echo "Old handwriting UI detected"
            exit 1
          fi
      - name: Install Cordova
        run: npm install --global cordova@13.0.0
      - name: Create Android app shell
        run: |
          cordova create android-build com.malaram.kidsseekho "Kids Seekho"
          rm -rf android-build/www/*
          cp index.html style.css app.js manifest.webmanifest sw.js android-build/www/
          if [ -d audio ]; then cp -R audio android-build/www/audio; fi
      - name: Add Android platform
        working-directory: android-build
        run: cordova platform add android@13.0.0 --no-telemetry
      - name: Add native text-to-speech
        working-directory: android-build
        run: cordova plugin add cordova-plugin-tts --no-telemetry
      - name: Build debug APK
        working-directory: android-build
        run: cordova build android --debug --no-telemetry
      - name: Verify debug APK and embedded app
        run: |
          APK=android-build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -p "$APK" assets/www/app.js > /tmp/apk-app.js
          test -s /tmp/apk-app.js
          node --check /tmp/apk-app.js
          cmp -s app.js /tmp/apk-app.js
          grep -Fq "A for Apple" /tmp/apk-app.js
          grep -Fq "अ से अनार" /tmp/apk-app.js
          grep -Fq "दिव्यांश" /tmp/apk-app.js
          echo "Tap-to-learn APK verification: PASS"
          sha256sum "$APK"
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kids-seekho-debug-apk
          path: android-build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
