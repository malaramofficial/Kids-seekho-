name: Kids Seekho Android Debug

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate JavaScript and AI sources
        run: |
          node --check app.js
          node --check ai.js
          node --check visual-ai.js
          grep -Fq "Google ML Kit" ai.js
          grep -Fq "KidsSeekhoAI.recognize" ai.js
          grep -Fq "KidsSeekhoAI.downloadModel" ai.js
          grep -Fq "KidsSeekhoAI.modelStatus" ai.js
          grep -Fq "setPointerCapture" ai.js
      - name: Install Cordova
        run: npm install --global cordova@13.0.0
      - name: Create Android app shell
        run: |
          cordova create android-build com.malaram.kidsseekho "Kids Seekho"
          rm -rf android-build/www/*
          cp index.html style.css app.js ai.js visual-ai.js manifest.webmanifest sw.js android-build/www/
          cp -R audio android-build/www/audio
      - name: Add Android platform
        working-directory: android-build
        run: cordova platform add android@13.0.0 --no-telemetry
      - name: Add native text-to-speech
        working-directory: android-build
        run: cordova plugin add cordova-plugin-tts --no-telemetry
      - name: Add native AI engine
        working-directory: android-build
        run: cordova plugin add ../kids-seekho-digital-ink --no-telemetry
      - name: Set ML Kit minimum Android API
        working-directory: android-build
        run: echo 'cdvMinSdkVersion=23' >> platforms/android/gradle.properties
      - name: Build debug APK
        working-directory: android-build
        run: cordova build android --debug --no-telemetry
      - name: Verify debug APK and embedded sources
        run: |
          APK=android-build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          unzip -p "$APK" assets/www/ai.js > /tmp/apk-ai.js
          test -s /tmp/apk-ai.js
          node --check /tmp/apk-ai.js
          cmp -s ai.js /tmp/apk-ai.js
          grep -Fq "Google ML Kit" /tmp/apk-ai.js
          grep -Fq "KidsSeekhoAI" /tmp/apk-ai.js
          grep -Fq "setPointerCapture" /tmp/apk-ai.js
          unzip -l "$APK" | grep -Fq "plugins/com.malaram.kidsseekho.digitalink/www/kidsSeekhoAI.js"
          unzip -l "$APK" | grep -Fq "libdigitalink.so"
          echo "APK embedded-source verification: PASS"
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kids-seekho-debug-apk
          path: android-build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
